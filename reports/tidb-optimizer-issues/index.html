<!DOCTYPE html>
<html lang="en" data-i18n-title="report.meta.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiDB Optimizer Open Issues: Triage, Severity &amp; Fix Difficulty Report</title>
<meta name="description" data-i18n-content="report.meta.description" content="Interactive triage explorer for open pingcap/tidb optimizer issues.">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#ffffff, #0d0f12);
    --surface: light-dark(#f6f8fa, #151920);
    --surface-hover: light-dark(#eef1f5, #1c212b);
    --border: light-dark(#dfe3e8, #272d38);
    --text: light-dark(#16191f, #e8ecf2);
    --muted: light-dark(#5c6573, #929cab);
    --link: light-dark(#0969da, #58a6ff);

    --easy-bg: light-dark(#e7f6ec, #132c1d);
    --easy-fg: light-dark(#136c34, #56d364);
    --med-bg: light-dark(#fff5db, #31250c);
    --med-fg: light-dark(#8c5800, #e3b341);
    --hard-bg: light-dark(#fdeaea, #361619);
    --hard-fg: light-dark(#b42318, #ff7b72);
    --enh-bg: light-dark(#e9f2ff, #13253e);
    --enh-fg: light-dark(#0b57d0, #79c0ff);
    --flt-bg: light-dark(#eff1f4, #20252e);
    --flt-fg: light-dark(#525b68, #9aa4b2);

    --sev-crit-bg: light-dark(#ffe4e6, #3b0d1d);
    --sev-crit-fg: light-dark(#9f1239, #fda4af);
    --sev-crit-bd: light-dark(#fecdd3, #881337);
    --sev-maj-bg: light-dark(#ffedd5, #361908);
    --sev-maj-fg: light-dark(#9a3412, #fdba74);
    --sev-maj-bd: light-dark(#fed7aa, #7c2d12);
    --sev-mod-bg: light-dark(#dbeafe, #132342);
    --sev-mod-fg: light-dark(#1e40af, #93c5fd);
    --sev-mod-bd: light-dark(#bfdbfe, #1e3a8a);
    --sev-min-bg: light-dark(#f2f4f7, #1e232c);
    --sev-min-fg: light-dark(#475467, #98a2b3);
    --sev-min-bd: light-dark(#d0d5dd, #344054);

    --pr-open-bg: light-dark(#ecfdf3, #102a1b);
    --pr-open-fg: light-dark(#067647, #4ade80);
    --pr-open-bd: light-dark(#abefc6, #1e5631);
    --pr-merged-bg: light-dark(#f4ebff, #25173d);
    --pr-merged-fg: light-dark(#6941c6, #c084fc);
    --pr-merged-bd: light-dark(#d6bbfb, #4c2882);
    --pr-draft-bg: light-dark(#eff8ff, #172334);
    --pr-draft-fg: light-dark(#175cd3, #7dd3fc);
    --pr-draft-bd: light-dark(#b2ddff, #274468);
    --pr-closed-bg: light-dark(#f2f4f7, #1d2129);
    --pr-closed-fg: light-dark(#667085, #8b95a5);
    --pr-closed-bd: light-dark(#d0d5dd, #323946);
    --qw-bg: light-dark(#fffbeb, #1f1b10);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0f12; --surface: #151920; --surface-hover: #1c212b; --border: #272d38;
    --text: #e8ecf2; --muted: #929cab; --link: #58a6ff;
    --easy-bg: #132c1d; --easy-fg: #56d364;
    --med-bg: #31250c; --med-fg: #e3b341;
    --hard-bg: #361619; --hard-fg: #ff7b72;
    --enh-bg: #13253e; --enh-fg: #79c0ff;
    --flt-bg: #20252e; --flt-fg: #9aa4b2;
    --sev-crit-bg: #3b0d1d; --sev-crit-fg: #fda4af; --sev-crit-bd: #881337;
    --sev-maj-bg: #361908; --sev-maj-fg: #fdba74; --sev-maj-bd: #7c2d12;
    --sev-mod-bg: #132342; --sev-mod-fg: #93c5fd; --sev-mod-bd: #1e3a8a;
    --sev-min-bg: #1e232c; --sev-min-fg: #98a2b3; --sev-min-bd: #344054;
    --pr-open-bg: #102a1b; --pr-open-fg: #4ade80; --pr-open-bd: #1e5631;
    --pr-merged-bg: #25173d; --pr-merged-fg: #c084fc; --pr-merged-bd: #4c2882;
    --pr-draft-bg: #172334; --pr-draft-fg: #7dd3fc; --pr-draft-bd: #274468;
    --pr-closed-bg: #1d2129; --pr-closed-fg: #8b95a5; --pr-closed-bd: #323946;
    --qw-bg: #1f1b10;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --surface: #f6f8fa; --surface-hover: #eef1f5; --border: #dfe3e8;
    --text: #16191f; --muted: #5c6573; --link: #0969da;
    --easy-bg: #e7f6ec; --easy-fg: #136c34;
    --med-bg: #fff5db; --med-fg: #8c5800;
    --hard-bg: #fdeaea; --hard-fg: #b42318;
    --enh-bg: #e9f2ff; --enh-fg: #0b57d0;
    --flt-bg: #eff1f4; --flt-fg: #525b68;
    --sev-crit-bg: #ffe4e6; --sev-crit-fg: #9f1239; --sev-crit-bd: #fecdd3;
    --sev-maj-bg: #ffedd5; --sev-maj-fg: #9a3412; --sev-maj-bd: #fed7aa;
    --sev-mod-bg: #dbeafe; --sev-mod-fg: #1e40af; --sev-mod-bd: #bfdbfe;
    --sev-min-bg: #f2f4f7; --sev-min-fg: #475467; --sev-min-bd: #d0d5dd;
    --pr-open-bg: #ecfdf3; --pr-open-fg: #067647; --pr-open-bd: #abefc6;
    --pr-merged-bg: #f4ebff; --pr-merged-fg: #6941c6; --pr-merged-bd: #d6bbfb;
    --pr-draft-bg: #eff8ff; --pr-draft-fg: #175cd3; --pr-draft-bd: #b2ddff;
    --pr-closed-bg: #f2f4f7; --pr-closed-fg: #667085; --pr-closed-bd: #d0d5dd;
    --qw-bg: #fffbeb;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.58;
    overflow-x: hidden;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px; background: var(--surface);
    padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 22px 16px 52px; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .topbar-right { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface);
  }
  .lang-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1.25;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-btn + .lang-btn { border-left: 1px solid var(--border); }
  .lang-btn:hover { background: var(--surface-hover); color: var(--text); }
  .lang-btn.active {
    background: var(--text);
    color: var(--bg);
    font-weight: 600;
  }
  .btn-sm {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 12px; line-height: 1.25; cursor: pointer;
    font-family: inherit;
  }
  .btn-sm:hover { background: var(--surface-hover); }

  h1 { font-size: 21px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  .sync-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 9px 12px; margin-bottom: 16px;
    font-size: 12.5px; color: var(--muted);
  }
  .sync-bar b { color: var(--text); font-weight: 600; }
  .copy-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 2px 7px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; cursor: pointer; max-width: 100%; word-break: break-all;
  }
  .copy-chip:hover { border-color: var(--link); color: var(--link); }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 11px 14px;
  }
  .kpi .lbl { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .kpi .val { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .funnel-bar {
    display: flex; width: 100%; height: 9px; border-radius: 3px;
    overflow: hidden; margin-bottom: 8px; background: var(--surface);
  }
  .funnel-seg { height: 100%; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 12px; color: var(--muted); margin-bottom: 18px;
  }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .matrix-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 14px; margin-bottom: 16px;
  }
  .matrix-head {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .matrix-title { font-size: 13.5px; font-weight: 650; }
  .matrix-sub { font-size: 12px; color: var(--muted); }
  .matrix-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.mtx {
    width: 100%; min-width: 560px; border-collapse: collapse; table-layout: fixed;
  }
  table.mtx th, table.mtx td {
    border: 1px solid var(--border); padding: 7px 8px;
    text-align: center; vertical-align: middle; font-size: 12.5px;
  }
  table.mtx th { background: var(--bg); color: var(--muted); font-weight: 600; font-size: 12px; }
  table.mtx th.row-hdr { text-align: left; width: 162px; color: var(--text); }
  table.mtx td.mcell {
    background: var(--bg); cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  table.mtx td.mcell:hover { background: var(--surface-hover); }
  table.mtx td.mcell.active {
    outline: 2px solid var(--link); outline-offset: -2px;
    background: var(--surface-hover);
  }
  table.mtx td.mcell.qw {
    background: var(--qw-bg);
  }
  .mc-num { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; line-height: 1.25; }
  .mc-sub { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

  details.analysis-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; margin-bottom: 16px;
  }
  details.analysis-box > summary {
    padding: 11px 14px; cursor: pointer; font-weight: 650; font-size: 13.5px;
    list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  details.analysis-box > summary::-webkit-details-marker { display: none; }
  .summary-hint { font-size: 12px; font-weight: 400; color: var(--muted); flex-shrink: 0; }
  .analysis-body {
    padding: 4px 14px 16px; border-top: 1px solid var(--border);
    font-size: 13px; line-height: 1.65;
  }
  .analysis-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-top: 10px;
  }
  .a-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 14px; min-width: 0;
  }
  .a-card h3 { margin: 0 0 8px; font-size: 13.5px; }
  .a-card ul { margin: 0; padding-left: 17px; }
  .a-card li { margin-bottom: 6px; word-break: break-word; }

  .controls {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type="search"], input[type="date"], select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 9px; font-size: 12.5px; min-width: 0; max-width: 100%;
    font-family: inherit;
  }
  input[type="search"] { flex: 1 1 230px; }
  select { flex: 0 1 auto; }
  .date-grp { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); max-width: 100%; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .pill.active {
    background: var(--text); color: var(--bg);
    border-color: var(--text); font-weight: 600;
  }

  .status-line {
    font-size: 12.5px; color: var(--muted); margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .mtx-active-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--enh-bg); color: var(--enh-fg);
    padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600;
  }
  .mtx-active-tag button {
    background: none; border: none; color: inherit; cursor: pointer;
    padding: 0 2px; font-size: 13px; font-weight: 700;
  }

  table.issues-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.issues-tbl th, table.issues-tbl td {
    text-align: left; padding: 10px 8px;
    border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word;
  }
  table.issues-tbl th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface); }
  col.c-id { width: 76px; }
  col.c-cat { width: 176px; }
  col.c-sub { width: 162px; }
  col.c-title { width: auto; }
  col.c-time { width: 186px; }
  table.issues-tbl tr:hover td { background: var(--surface-hover); }

  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 3px;
    font-size: 11.5px; font-weight: 600; line-height: 1.38;
  }
  .badge-easy { background: var(--easy-bg); color: var(--easy-fg); }
  .badge-medium { background: var(--med-bg); color: var(--med-fg); }
  .badge-hard { background: var(--hard-bg); color: var(--hard-fg); }
  .badge-enh { background: var(--enh-bg); color: var(--enh-fg); }
  .badge-fuzz, .badge-ai, .badge-other { background: var(--flt-bg); color: var(--flt-fg); }

  .sev-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 11px; font-weight: 600; line-height: 1.4; margin-top: 4px;
    border: 1px solid transparent;
  }
  .sev-critical { background: var(--sev-crit-bg); color: var(--sev-crit-fg); border-color: var(--sev-crit-bd); }
  .sev-major { background: var(--sev-maj-bg); color: var(--sev-maj-fg); border-color: var(--sev-maj-bd); }
  .sev-moderate { background: var(--sev-mod-bg); color: var(--sev-mod-fg); border-color: var(--sev-mod-bd); }
  .sev-minor { background: var(--sev-min-bg); color: var(--sev-min-fg); border-color: var(--sev-min-bd); }
  .sev-na { background: var(--flt-bg); color: var(--flt-fg); border-color: var(--border); }
  .gh-sev-note { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
  .tag-mini {
    display: inline-block; padding: 1px 5px; border: 1px solid var(--border);
    border-radius: 3px; font-size: 11px; color: var(--muted);
  }
  .tag-cust { border-color: var(--hard-fg); color: var(--hard-fg); font-weight: 500; }
  .tag-keep { border-color: var(--enh-fg); color: var(--enh-fg); font-weight: 500; }

  .pr-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .pr-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 7px; border-radius: 3px; font-size: 11.5px; font-weight: 600;
    border: 1px solid transparent; text-decoration: none;
    font-variant-numeric: tabular-nums;
  }
  .pr-chip:hover { text-decoration: underline; filter: brightness(0.97); }
  .pr-open { background: var(--pr-open-bg); color: var(--pr-open-fg); border-color: var(--pr-open-bd); }
  .pr-merged { background: var(--pr-merged-bg); color: var(--pr-merged-fg); border-color: var(--pr-merged-bd); }
  .pr-draft { background: var(--pr-draft-bg); color: var(--pr-draft-fg); border-color: var(--pr-draft-bd); border-style: dashed; }
  .pr-closed { background: var(--pr-closed-bg); color: var(--pr-closed-fg); border-color: var(--pr-closed-bd); font-weight: 500; }

  .note-txt { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .meta-cell { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .upd-val { color: var(--text); font-weight: 600; display: block; }
  .iss-title-link { color: var(--text); font-weight: 500; }
  .iss-title-link:hover { color: var(--link); text-decoration: underline; }

  @media (max-width: 780px) {
    .wrap { padding: 14px 12px 36px; }
    h1 { font-size: 18px; }
    .analysis-grid { grid-template-columns: 1fr; }
    table.issues-tbl thead { display: none; }
    table.issues-tbl, table.issues-tbl tbody, table.issues-tbl tr, table.issues-tbl td {
      display: block; width: 100%;
    }
    table.issues-tbl tr {
      border: 1px solid var(--border); border-radius: 4px;
      padding: 10px 12px; margin-bottom: 10px; background: var(--surface);
    }
    table.issues-tbl td { border: none; padding: 3px 0; }
  }
  @media (max-width: 540px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topbar">
    <div><a href="../../" data-keep-lang data-i18n="common.backHome">← winoros.github.io</a></div>
    <div class="topbar-right">
      <a href="./data.json" target="_blank" rel="noopener" data-i18n="report.nav.dataJson">增量数据源 (data.json)</a>
      <a href="https://github.com/pingcap/tidb/issues?q=is%3Aissue+is%3Aopen+label%3Asig%2Fplanner" target="_blank" rel="noopener" data-i18n="report.nav.ghIssues">GitHub Issues</a>
      <div class="lang-switch" role="group" data-i18n-aria-label="common.langSwitchAria" aria-label="Language">
        <button type="button" class="lang-btn" data-lang-opt="zh-CN">中文</button>
        <button type="button" class="lang-btn" data-lang-opt="en">EN</button>
      </div>
      <button class="btn-sm" id="themeBtn" type="button" data-i18n="common.toggleTheme" data-i18n-aria-label="common.toggleThemeAria">切换主题</button>
    </div>
  </nav>
  <h1 data-i18n="report.header.title">TiDB 优化器开放 Issue 全景筛除、严重度与修复难度分级报告</h1>
  <div class="sub" id="pageSub"></div>

  <div class="sync-bar">
    <span>🕒 <b data-i18n="report.sync.snapshotLabel">快照拉取</b>: <span id="syncSnapTxt"></span></span>
    <span>📌 <b data-i18n="report.sync.watermarkLabel">最新 Issue 更新水位线</b>: <code id="syncWatermarkCode"></code></span>
    <span>🔄 <b data-i18n="report.sync.queryLabel">增量更新检索条件</b>: <button type="button" class="copy-chip" id="copySyncBtn" data-i18n-title="report.sync.copyTitle"></button></span>
  </div>

  <div class="kpi-grid" id="kpis"></div>
  <div class="funnel-bar" id="funnelBar"></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--easy-fg)"></i><span><span data-i18n="report.legend.easy"></span> (<b id="lg-easy">0</b>)</span></span>
    <span><i class="dot" style="background:var(--med-fg)"></i><span><span data-i18n="report.legend.med"></span> (<b id="lg-med">0</b>)</span></span>
    <span><i class="dot" style="background:var(--hard-fg)"></i><span><span data-i18n="report.legend.hard"></span> (<b id="lg-hard">0</b>)</span></span>
    <span><i class="dot" style="background:var(--enh-fg)"></i><span><span data-i18n="report.legend.enh"></span> (<b id="lg-enh">0</b>)</span></span>
    <span><i class="dot" style="background:var(--flt-fg)"></i><span><span data-i18n="report.legend.flt"></span> (<b id="lg-flt">0</b>)</span></span>
  </div>

  <div class="matrix-box">
    <div class="matrix-head">
      <span class="matrix-title" data-i18n="report.matrix.title"></span>

        <option value="MAJOR" data-i18n="report.filters.sev.major"></option>

<script src="./i18n/en.js"></script>
<script src="./data.js"></script>
<script>
(function() {
  "use strict";

  var esc = SiteI18n.escHtml;
  var t = SiteI18n.t;
  var META = window.REPORT_DATASET.sync_meta;
  var DATA = window.REPORT_DATASET.records;
  var SNAPSHOT_MS = Date.parse(META.snapshot_utc);

  var BADGE_CLS = {
    EASY: "badge-easy",
    MEDIUM: "badge-medium",
    HARD: "badge-hard",
    ENHANCEMENT: "badge-enh",
    FILTER_RANDOM_FUZZ: "badge-fuzz",
    FILTER_AI_OBSCURE: "badge-ai",
    FILTER_NON_OPT_OR_FIXED: "badge-other"
  };

  var SEV_CLS = {
    CRITICAL: "sev-critical",
    MAJOR: "sev-major",
    MODERATE: "sev-moderate",
    MINOR: "sev-minor",
    "N/A": "sev-na"
  };

  var activeCat = "REAL_ALL";
  var mtxDiff = null;
  var mtxSev = null;
  var copyFeedbackTimer = null;

  var SCOPE_COUNTS = {
    all: DATA.length,
    can: DATA.filter(function(r) { return r.is_canonical; }).length,
    cust: DATA.filter(function(r) { return r.is_customer; }).length,
    bdr: DATA.filter(function(r) { return r.is_borderline_kept; }).length
  };
  SCOPE_COUNTS.sup = SCOPE_COUNTS.all - SCOPE_COUNTS.can;

  function renderSyncAndScopeMeta() {
    document.getElementById("syncSnapTxt").textContent = META.snapshot_utc8;
    var wm = document.getElementById("syncWatermarkCode");
    wm.textContent = META.max_issue_updated_utc8;
    wm.setAttribute("title", META.max_issue_updated_utc);

    if (!copyFeedbackTimer) {
      document.getElementById("copySyncBtn").textContent = META.incremental_gh_search_qualifier + " 📋";
    }

    document.getElementById("optScopeAll").textContent = t("report.filters.scope.all", { count: SCOPE_COUNTS.all });
    document.getElementById("optScopeCan").textContent = t("report.filters.scope.canonical", { count: SCOPE_COUNTS.can });
    document.getElementById("optScopeCust").textContent = t("report.filters.scope.customer", { count: SCOPE_COUNTS.cust });
    document.getElementById("optScopeBdr").textContent = t("report.filters.scope.borderline", { count: SCOPE_COUNTS.bdr });
    document.getElementById("pageSub").textContent = t("report.header.subtitle", {
      totalAll: SCOPE_COUNTS.all,
      totalCan: SCOPE_COUNTS.can,
      totalSup: SCOPE_COUNTS.sup
    });
  }

  document.getElementById("copySyncBtn").addEventListener("click", function() {
    var query = META.incremental_gh_search_qualifier;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(query);
      }
    } catch (_) {}
    var btn = this;
    btn.textContent = t("report.sync.copied", { query: query });
    if (copyFeedbackTimer) clearTimeout(copyFeedbackTimer);
    copyFeedbackTimer = setTimeout(function() {
      copyFeedbackTimer = null;
      btn.textContent = query + " 📋";
    }, 1800);
  });

  function getScoped() {
    var sc = document.getElementById("scopeSel").value;
    return DATA.filter(function(r) {
      if (sc === "canonical") return r.is_canonical;
      if (sc === "customer") return r.is_customer;
      if (sc === "borderline") return r.is_borderline_kept;
      return true;
    });
  }

  function renderSummaryAndMatrix(scoped) {
    var total = scoped.length || 1;
    function cnt(c) { return scoped.filter(function(r) { return r.cat === c; }).length; }
    var easy = cnt("EASY"), med = cnt("MEDIUM"), hard = cnt("HARD");
    var realList = scoped.filter(function(r) { return r.cat === "EASY" || r.cat === "MEDIUM" || r.cat === "HARD"; });
    var real = realList.length;
    var enh = cnt("ENHANCEMENT");
    var fuzz = cnt("FILTER_RANDOM_FUZZ"), ai = cnt("FILTER_AI_OBSCURE"), oth = cnt("FILTER_NON_OPT_OR_FIXED");
    var flt = fuzz + ai + oth;

    var critCnt = realList.filter(function(r) { return r.severity === "CRITICAL"; }).length;
    var majCnt = realList.filter(function(r) { return r.severity === "MAJOR"; }).length;
    var openPrReal = realList.filter(function(r) { return r.has_open_pr; }).length;
    var unclaimedReal = real - openPrReal;

    document.getElementById("kpis").innerHTML =
      '<div class="kpi"><div class="lbl">' + esc(t("report.kpi.scopedTotal.label")) + '</div><div class="val">' + scoped.length + '</div><div class="hint">' + esc(t("report.kpi.scopedTotal.hint")) + '</div></div>' +
      '<div class="kpi"><div class="lbl">' + esc(t("report.kpi.realBugs.label")) + '</div><div class="val" style="color:var(--hard-fg)">' + real + '</div><div class="hint">' + esc(t("report.kpi.realBugs.hint", { pct: (real * 100 / total).toFixed(1), easy: easy, med: med, hard: hard })) + '</div></div>' +
      '<div class="kpi"><div class="lbl">' + esc(t("report.kpi.highSev.label")) + '</div><div class="val" style="color:var(--sev-crit-fg)">' + (critCnt + majCnt) + '</div><div class="hint">' + esc(t("report.kpi.highSev.hint", { crit: critCnt, maj: majCnt })) + '</div></div>' +
      '<div class="kpi"><div class="lbl">' + esc(t("report.kpi.prCoverage.label")) + '</div><div class="val" style="color:var(--pr-open-fg)">' + openPrReal + ' <span style="font-size:13px;font-weight:500;color:var(--muted)">/ ' + real + '</span></div><div class="hint">' + esc(t("report.kpi.prCoverage.hint", { open: openPrReal, unclaimed: unclaimedReal })) + '</div></div>' +
      '<div class="kpi"><div class="lbl">' + esc(t("report.kpi.enhAndNoise.label")) + '</div><div class="val" style="color:var(--enh-fg)">' + enh + ' <span style="font-size:13px;font-weight:500;color:var(--muted)">/ ' + flt + '</span></div><div class="hint">' + esc(t("report.kpi.enhAndNoise.hint", { fuzz: fuzz, ai: ai, oth: oth })) + '</div></div>';

    document.getElementById("lg-easy").textContent = easy;
    document.getElementById("lg-med").textContent = med;
    document.getElementById("lg-hard").textContent = hard;
    document.getElementById("lg-enh").textContent = enh;
    document.getElementById("lg-flt").textContent = flt;

    document.getElementById("funnelBar").innerHTML =
      '<div class="funnel-seg" style="width:' + (easy * 100 / total) + '%;background:var(--easy-fg)"></div>' +
      '<div class="funnel-seg" style="width:' + (med * 100 / total) + '%;background:var(--med-fg)"></div>' +
      '<div class="funnel-seg" style="width:' + (hard * 100 / total) + '%;background:var(--hard-fg)"></div>' +
      '<div class="funnel-seg" style="width:' + (enh * 100 / total) + '%;background:var(--enh-fg)"></div>' +
      '<div class="funnel-seg" style="width:' + (flt * 100 / total) + '%;background:var(--flt-fg)"></div>';

    var diffs = [
      { k: "EASY", lbl: t("report.matrix.rowEasy") },
      { k: "MEDIUM", lbl: t("report.matrix.rowMed") },
      { k: "HARD", lbl: t("report.matrix.rowHard") }
    ];
    var sevs = ["CRITICAL", "MAJOR", "MODERATE", "MINOR"];

    var mtxHtml = "";
    for (var di = 0; di < diffs.length; di++) {
      var d = diffs[di];
      var rowItems = realList.filter(function(r) { return r.cat === d.k; });
      var cells = "";
      for (var si = 0; si < sevs.length; si++) {
        var s = sevs[si];
        var cellItems = rowItems.filter(function(r) { return r.severity === s; });
        var inPr = cellItems.filter(function(r) { return r.has_open_pr; }).length;
        var wait = cellItems.length - inPr;
        var isAct = (mtxDiff === d.k && mtxSev === s) ? " active" : "";
        var isQw = (d.k === "EASY" && (s === "CRITICAL" || s === "MAJOR")) ? " qw" : "";
        var cellSub = cellItems.length ? esc(t("report.matrix.cellSub", { wait: wait, inPr: inPr })) : "—";
        cells += '<td class="mcell' + isQw + isAct + '" data-d="' + d.k + '" data-s="' + s + '">' +
          '<span class="mc-num">' + cellItems.length + '</span>' +
          '<span class="mc-sub">' + cellSub + '</span>' +
        '</td>';
      }
      var rAct = (mtxDiff === d.k && !mtxSev) ? " active" : "";
      var rInPr = rowItems.filter(function(r) { return r.has_open_pr; }).length;
      mtxHtml += '<tr>' +
        '<th class="row-hdr">' + esc(d.lbl) + '</th>' +
        cells +
        '<td class="mcell' + rAct + '" data-d="' + d.k + '" data-s="">' +
          '<span class="mc-num">' + rowItems.length + '</span>' +
          '<span class="mc-sub">' + esc(t("report.matrix.unclaimedSub", { wait: rowItems.length - rInPr })) + '</span>' +
        '</td>' +
      '</tr>';
    }

    var colTotals = "";
    for (var ci = 0; ci < sevs.length; ci++) {
      var cs = sevs[ci];
      var cItems = realList.filter(function(r) { return r.severity === cs; });
      var cInPr = cItems.filter(function(r) { return r.has_open_pr; }).length;
      var cAct = (!mtxDiff && mtxSev === cs) ? " active" : "";
      colTotals += '<td class="mcell' + cAct + '" data-d="" data-s="' + cs + '">' +
        '<span class="mc-num">' + cItems.length + '</span>' +
        '<span class="mc-sub">' + esc(t("report.matrix.unclaimedSub", { wait: cItems.length - cInPr })) + '</span>' +
      '</td>';
    }
    mtxHtml += '<tr>' +
      '<th class="row-hdr">' + esc(t("report.matrix.rowTotal")) + '</th>' +
      colTotals +
      '<td class="mcell" data-d="RESET" data-s="RESET">' +
        '<span class="mc-num">' + real + '</span>' +
        '<span class="mc-sub">' + esc(t("report.matrix.resetSub")) + '</span>' +
      '</td>' +
    '</tr>';

    document.getElementById("mtxBody").innerHTML = mtxHtml;
  }

  function formatPrChip(p) {
    var cls = "pr-open";
    var stTxt = p.state;
    if (p.state === "MERGED") cls = "pr-merged";
    else if (p.state === "DRAFT") cls = "pr-draft";
    else if (p.state === "CLOSED") cls = "pr-closed";
    else if (p.is_cherry_pick) stTxt = "CP-OPEN";
    var tip = "[" + p.repo + "] " + p.label + " (" + p.state + "): " + p.title;
    return '<a class="pr-chip ' + cls + '" href="' + esc(p.url) + '" target="_blank" rel="noopener" title="' + esc(tip) + '">PR ' + esc(p.label) + ' · ' + esc(stTxt) + '</a>';
  }

  function getNoteText(r, loc) {
    if (!r.note) return "";
    if (typeof r.note === "string") return r.note;
    return r.note[loc] || r.note.en || r.note["zh-CN"] || "";
  }

  function render() {
    var loc = SiteI18n.getLocale();
    renderSyncAndScopeMeta();

    var scoped = getScoped();
    renderSummaryAndMatrix(scoped);

    var q = document.getElementById("q").value.trim().toLowerCase();
    var sub = document.getElementById("subSel").value;
    var sev = document.getElementById("sevSel").value;
    var prFilter = document.getElementById("prSel").value;
    var updWin = document.getElementById("updWindowSel").value;
    var sinceDate = document.getElementById("sinceDate").value;
    var sortBy = document.getElementById("sortSel").value;

    var badgeEl = document.getElementById("mtxFilterBadge");
    if (mtxDiff || mtxSev) {
      var dText = mtxDiff ? t("report.enums.cat." + mtxDiff) : t("report.matrix.allDiff");
      var sText = mtxSev ? t("report.enums.severity." + mtxSev) : t("report.matrix.allSev");
      badgeEl.innerHTML = '<span class="mtx-active-tag">' + esc(t("report.matrix.activeBadge", { diff: dText, sev: sText })) + ' <button type="button" id="clrMtxBtn" title="' + esc(t("report.matrix.clearTitle")) + '">×</button></span>';
      document.getElementById("clrMtxBtn").onclick = function() { mtxDiff = null; mtxSev = null; render(); };
    } else {
      badgeEl.innerHTML = "";
    }

    var rows = scoped.filter(function(r) {
      var isReal = r.cat === "EASY" || r.cat === "MEDIUM" || r.cat === "HARD";
      if (mtxDiff || mtxSev) {
        if (!isReal) return false;
        if (mtxDiff && r.cat !== mtxDiff) return false;
        if (mtxSev && r.severity !== mtxSev) return false;
      } else {
        if (activeCat === "REAL_ALL" && !isReal) return false;
        if (activeCat !== "REAL_ALL" && activeCat !== "ALL" && r.cat !== activeCat) return false;
      }

      if (sub !== "all" && r.subsystem !== sub) return false;

      if (sev === "HIGH_S0_S1" && r.severity !== "CRITICAL" && r.severity !== "MAJOR") return false;
      if ((sev === "CRITICAL" || sev === "MAJOR" || sev === "MODERATE" || sev === "MINOR") && r.severity !== sev) return false;
      if (sev === "GH_UNLABELED" && r.gh_severity !== "unlabeled") return false;

      if (prFilter === "open_fix" && !r.has_open_pr) return false;
      if (prFilter === "unclaimed" && r.has_open_pr) return false;
      if (prFilter === "has_any" && !r.has_pr) return false;
      if (prFilter === "has_merged" && !r.has_merged_pr) return false;
      if (prFilter === "no_pr" && r.has_pr) return false;

      if (updWin !== "all") {
        var days = parseInt(updWin, 10);
        var cutoffMs = SNAPSHOT_MS - days * 86400 * 1000;
        if (Date.parse(r.updated_at) < cutoffMs) return false;
      }
      if (sinceDate) {
        if (r.updated_display.slice(0, 10) < sinceDate && r.updated_at.slice(0, 10) < sinceDate) return false;
      }

      if (q) {
        var prText = r.prs.map(function(p) { return p.label + " " + p.title + " " + p.state; }).join(" ");
        var noteAll = r.note ? ((r.note["zh-CN"] || "") + " " + (r.note.en || "")) : "";
        var subAll = t("report.enums.subsystem." + r.subsystem, null, "zh-CN") + " " + t("report.enums.subsystem." + r.subsystem, null, "en");
        var hay = ("#" + r.number + " " + r.title + " @" + r.author + " " + noteAll + " " + subAll + " " + r.subsystem + " " + r.severity + " " + r.gh_severity + " " + prText).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    rows.sort(function(a, b) {
      if (sortBy === "updated_desc") {
        if (b.updated_at !== a.updated_at) return b.updated_at.localeCompare(a.updated_at);
        return b.number - a.number;
      }
      if (sortBy === "prio_desc") {
        if (b.sev_rank !== a.sev_rank) return b.sev_rank - a.sev_rank;
        var da = a.diff_rank || 99, db = b.diff_rank || 99;
        if (da !== db) return da - db;
        return b.number - a.number;
      }
      if (sortBy === "num_asc") return a.number - b.number;
      return b.number - a.number;
    });

    document.getElementById("countTxt").textContent = t("report.status.count", { matched: rows.length, scoped: scoped.length });

    var htmlRows = rows.map(function(r) {
      var tags = "";
      if (r.is_customer) tags += '<span class="tag-mini tag-cust">' + esc(t("report.table.tagCustomer")) + '</span>';
      if (r.is_borderline_kept) tags += '<span class="tag-mini tag-keep">' + esc(t("report.table.tagBorderline")) + '</span>';
      if (!r.is_canonical) tags += '<span class="tag-mini">' + esc(t("report.table.tagSupplemental")) + '</span>';
      var tagWrap = tags ? '<div class="tag-row">' + tags + '</div>' : "";

      var noteStr = getNoteText(r, loc);
      var noteHtml = noteStr ? '<div class="note-txt">' + esc(noteStr) + '</div>' : "";
      var prWrap = r.prs.length ? '<div class="pr-row">' + r.prs.map(formatPrChip).join("") + '</div>' : "";

      var sevHtml = "";
      var ghRawDisp = r.gh_severity === "unlabeled" ? t("report.table.ghUnlabeled") : r.gh_severity;
      if (r.severity !== "N/A") {
        var ghDiffers = r.gh_severity.toUpperCase() !== r.severity;
        var ghNote = ghDiffers ? '<div class="gh-sev-note">' + esc(t("report.table.ghSevNote", { val: ghRawDisp })) + '</div>' : "";
        sevHtml = '<div><span class="sev-badge ' + (SEV_CLS[r.severity] || "sev-na") + '">' + esc(t("report.enums.severity." + r.severity)) + '</span></div>' + ghNote;
      } else if (r.gh_severity !== "unlabeled") {
        sevHtml = '<div class="gh-sev-note">' + esc(t("report.table.ghSevNote", { val: ghRawDisp })) + '</div>';
      }

      var issUrl = "https://github.com/pingcap/tidb/issues/" + r.number;
      return '<tr>' +
        '<td><a href="' + issUrl + '" target="_blank" rel="noopener"><b>#' + r.number + '</b></a></td>' +
        '<td>' +
          '<span class="badge ' + (BADGE_CLS[r.cat] || "badge-other") + '">' + esc(t("report.enums.cat." + r.cat)) + '</span>' +
          '<div class="note-txt">' + esc(t("report.enums.diff." + r.cat)) + '</div>' +
          sevHtml +
        '</td>' +
        '<td>' + esc(t("report.enums.subsystem." + r.subsystem)) + '</td>' +
        '<td>' +
          '<div><a class="iss-title-link" href="' + issUrl + '" target="_blank" rel="noopener">' + esc(r.title) + '</a></div>' +
          tagWrap + noteHtml + prWrap +
        '</td>' +
        '<td class="meta-cell">' +
          '<span class="upd-val" title="UTC ISO: ' + esc(r.updated_at) + '">' + esc(t("report.table.updatedPrefix", { time: r.updated_display })) + '</span>' +
          '<span>' + esc(t("report.table.createdPrefix", { date: r.created })) + '</span><br>' +
          '<span>@' + esc(r.author) + '</span>' +
        '</td>' +
      '</tr>';
    }).join("");

    document.getElementById("tbody").innerHTML = htmlRows || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:28px">' + esc(t("report.table.empty")) + '</td></tr>';
  }

  document.getElementById("mtxBody").addEventListener("click", function(e) {
    var td = e.target.closest(".mcell");
    if (!td) return;
    var d = td.dataset.d;
    var s = td.dataset.s;
    if (d === "RESET") {
      mtxDiff = null; mtxSev = null;
    } else {
      var nextD = d || null;
      var nextS = s || null;
      if (mtxDiff === nextD && mtxSev === nextS) {
        mtxDiff = null; mtxSev = null;
      } else {
        mtxDiff = nextD; mtxSev = nextS;
      }
    }
    render();
  });

  ["q", "scopeSel", "subSel", "sevSel", "prSel", "updWindowSel", "sinceDate", "sortSel"].forEach(function(id) {
    var el = document.getElementById(id);
    el.addEventListener(el.tagName === "INPUT" && el.type === "search" ? "input" : "change", render);
  });

  document.getElementById("catPills").addEventListener("click", function(e) {
    var btn = e.target.closest(".pill");
    if (!btn) return;
    document.querySelectorAll(".pill").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    activeCat = btn.dataset.cat;
    mtxDiff = null;
    mtxSev = null;
    render();
  });

  SiteI18n.onChange(render);
  SiteI18n.init();
  render();
})();
</script>
</body>
</html>
